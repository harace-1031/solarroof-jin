<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLARROOF_JIN 관리자</title><style>body{font-family:system-ui;background:#f3f6f3;color:#183d35;margin:0;padding:24px}main{max-width:440px;margin:10vh auto;background:white;padding:28px;border-radius:16px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin-top:12px;border:1px solid #abc2b6;border-radius:8px}button{background:#185d48;color:white;cursor:pointer}p{line-height:1.7}</style><main><h1>SOLARROOF_JIN 관리자</h1><p>검색 결과에서 주소를 선택해 위치 조회가 완료될 때마다 건물주소과 검색일시를 저장합니다. 같은 건물주소을 다시 조회해도 별도 행으로 남으며, 엑셀의 시각은 한국시간입니다. 이름과 IP는 이 목록에 저장하지 않습니다.</p><form method="post" action="/admin/export"><label>관리자 비밀번호<input type="password" name="password" required maxlength="512" autocomplete="current-password"></label><button>검색 건물주소 엑셀 다운로드</button></form><p>Render의 ADMIN_PASSWORD에 설정한 비밀번호를 입력하세요. 저장소 연결이 실패하면 오류가 표시됩니다.</p><a href="/">사이트로 돌아가기</a></main></html>
